<!DOCTYPE html>
<html><head><meta charset="utf-8">
<!--
  Stills for the preview videos, rendered with transparent backgrounds by tools/app-preview-edit.sh.
    preview.html?m=bg&c=green|sky|clay   1080 x 1920 backdrop with a phone whose screen is a hole
    preview.html?m=cap&a=..&b=..&c=..    1080 x 520 two-line headline, second line in colour
    preview.html?m=pill&t=..             886 x 300 caption pill for the App Store preview
    preview.html?m=end                   1080 x 1920 closing card
-->
<style>
  @font-face { font-family: R; src: local("SF Pro Rounded Black"), local("SFProRounded-Black"); font-weight: 900; }
  @font-face { font-family: R; src: local("SF Pro Rounded Heavy"), local("SFProRounded-Heavy"); font-weight: 800; }
  @font-face { font-family: R; src: local("SF Pro Rounded Semibold"), local("SFProRounded-Semibold"); font-weight: 600; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { background:transparent; overflow:hidden; font-family:R, -apple-system, sans-serif; color:#22302A; }
  .cap { width:1080px; height:520px; display:flex; flex-direction:column; justify-content:center; text-align:center; }
  .cap h1 { font-weight:900; font-size:116px; line-height:1.02; letter-spacing:-2.5px; }
  .pillwrap { width:886px; height:300px; display:flex; align-items:center; justify-content:center; }
  .pill { background:rgba(255,255,255,.96); border-radius:60px; padding:30px 48px; text-align:center;
          box-shadow:0 18px 50px rgba(34,48,42,.22); font-weight:900; font-size:60px; line-height:1.05; letter-spacing:-1px; }
  .end { width:1080px; height:1920px; background:radial-gradient(circle at 50% 40%, #2C5A39 0, #1F4029 45%, #17301F 100%);
         color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .end img { width:300px; height:300px; border-radius:68px; box-shadow:0 30px 80px rgba(0,0,0,.35); }
  .end h1 { margin-top:56px; font-weight:900; font-size:150px; letter-spacing:-4px; }
  .end p { margin-top:18px; font-weight:600; font-size:56px; color:#BFD8C4; }
  .end .row { margin-top:64px; display:flex; gap:24px; }
  .end .row div { background:#2A5236; border-radius:999px; padding:20px 40px; font-weight:800; font-size:42px; }
  .end .row div.on { background:#8FD694; color:#17301F; }
</style></head>
<body>
<script>
  const q = new URLSearchParams(location.search);
  const m = q.get("m");
  const tint = { green:["#DDF3E2","#EEF8F0","#FFFFFF","#4CAF50"], sky:["#D9EEFB","#EAF6FD","#F6FBFE","#1769AA"],
                 clay:["#F6EDE6","#FBF6F2","#FFFFFF","#B98A6E"] };
  if (m === "bg") {
    const [a, b, c] = tint[q.get("c") || "green"];
    // Screen 720 x 1564 at (180, 600); bezel 20 around it. The screen is cut out so the video shows through.
    document.body.innerHTML = `
    <svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="50%" cy="62%" r="75%"><stop offset="0" stop-color="${a}"/><stop offset=".45" stop-color="${b}"/><stop offset="1" stop-color="${c}"/></radialGradient>
        <mask id="hole"><rect width="1080" height="1920" fill="#fff"/><rect x="180" y="600" width="720" height="1564" rx="96" fill="#000"/></mask>
        <filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="40" stdDeviation="40" flood-color="#22302A" flood-opacity=".25"/></filter>
      </defs>
      <g mask="url(#hole)">
        <rect width="1080" height="1920" fill="url(#g)"/>
        <rect x="160" y="580" width="760" height="1604" rx="116" fill="#1D2420" filter="url(#s)"/>
        <rect x="156" y="576" width="768" height="1612" rx="120" fill="none" stroke="rgba(255,255,255,.7)" stroke-width="5"/>
      </g>
      <text x="90" y="640" font-size="70" fill="#E8A800">✦</text>
      <text x="930" y="820" font-size="96" fill="#E8A800">✦</text>
      <text x="60" y="1060" font-size="54" fill="#E8A800">✦</text>
    </svg>`;
  } else if (m === "cap") {
    const col = tint[q.get("c") || "green"][3];
    document.body.innerHTML = `<div class="cap"><h1>${q.get("a")}<br><span style="color:${col}">${q.get("b")}</span></h1></div>`;
  } else if (m === "pill") {
    document.body.innerHTML = `<div class="pillwrap"><div class="pill">${q.get("t")}</div></div>`;
  } else if (m === "end") {
    document.body.innerHTML = `<div class="end"><img src="../../site/icon.png"><h1>NicFree</h1>
      <p>Quit Zyn, pouches &amp; vapes.</p>
      <div class="row"><div class="on">No subscription</div><div>No account</div></div></div>`;
  }
</script>
</body></html>
